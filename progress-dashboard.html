<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@Sanskar_in">
    <meta name="twitter:creator" content="@Sanskar_in">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="splash.png">
    <title>Progress Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --text: #f8fafc; --accent1: #6c63ff; --accent2: #3ecfcf; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        nav { background: var(--glass); padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent1); }
        nav a { color: var(--text); text-decoration: none; margin-left: 1rem; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; backdrop-filter: blur(10px); }
        .stat-val { font-size: 2.5rem; font-weight: 700; color: var(--accent2); }
        .progress-wrap { margin-top: 1rem; }
        .progress-wrap div { margin-bottom: 0.5rem; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .bar-fg { height: 100%; background: linear-gradient(90deg, var(--accent1), var(--accent2)); transition: width 0.5s; }
        .reset-btn { margin-top: 2rem; padding: 0.75rem 1.5rem; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: all 0.2s; }
        .reset-btn:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <nav><div class="logo">WebDev Mastery</div><div><a href="index.html">Home</a><a href="progress-dashboard.html">Dashboard</a></div></nav>
    <div class="container">
        <h1 style="margin-bottom: 2rem;">Learning Dashboard</h1>
        <div class="grid">
            <div class="card">
                <h3>Overall XP</h3>
                <div class="stat-val" id="xp-val">1250 XP</div>
                <p style="opacity: 0.7">Level 5 Web Developer</p>
            </div>
            <div class="card">
                <h3>Learning Streak</h3>
                <div class="stat-val" id="streak-val">3 Days</div>
                <p style="opacity: 0.7">Keep it up!</p>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h3>Module Progress</h3>
                <div class="progress-wrap">
                    <div><span>HTML Fundamentals</span><span>80%</span></div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 80%;"></div></div>
                </div>
                <div class="progress-wrap">
                    <div><span>CSS Styling</span><span>45%</span></div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 45%;"></div></div>
                </div>
                <div class="progress-wrap">
                    <div><span>JavaScript Basics</span><span>15%</span></div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 15%;"></div></div>
                </div>
                <button class="reset-btn" onclick="resetProgress()">Reset Progress</button>
            </div>
        </div>
    </div>
    <script>
        function resetProgress() {
            if(confirm("Are you sure you want to reset all your progress?")) {
                localStorage.removeItem('webDevXp');
                location.reload();
            }
        }
    </script>
</body>
</html>
