<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://sanskarin.github.io/Web-Development-Mastery/playground.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@Sanskar_in">
    <meta name="twitter:creator" content="@Sanskar_in">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="splash.png">
    <title>Code Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --text: #f8fafc; --accent1: #6c63ff; --accent2: #3ecfcf; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        nav { background: var(--glass); padding: 0.75rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .logo { font-weight: 700; color: var(--accent2); }
        .controls { display: flex; gap: 1rem; }
        select, button { background: var(--glass); color: var(--text); border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button { background: var(--accent1); font-weight: 600; border: none; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .editors { display: flex; flex-direction: column; width: 50%; border-right: 1px solid rgba(255,255,255,0.1); }
        .editor-pane { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .editor-header { padding: 0.5rem 1rem; background: rgba(0,0,0,0.3); font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; color: var(--accent2); }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; padding: 1rem; border: none; resize: none; font-family: monospace; font-size: 14px; outline: none; }
        .preview { width: 50%; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        @media(max-width: 768px) { .workspace { flex-direction: column; } .editors, .preview { width: 100%; height: 50%; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Playground</div>
        <div class="controls">
            <select id="examples">
                <option value="empty">Empty</option>
                <option value="flexbox">Flexbox Example</option>
                <option value="button">Animated Button</option>
            </select>
            <button onclick="runCode()">Run</button>
            <button onclick="downloadCode()" style="background: var(--glass); border: 1px solid var(--accent1);">Download</button>
        </div>
    </nav>
    <div class="workspace">
        <div class="editors">
            <div class="editor-pane">
                <div class="editor-header">HTML</div>
                <textarea id="html-code" spellcheck="false">&lt;h1&gt;Hello World&lt;/h1&gt;</textarea>
            </div>
            <div class="editor-pane">
                <div class="editor-header">CSS</div>
                <textarea id="css-code" spellcheck="false">h1 { color: #6c63ff; text-align: center; font-family: sans-serif; }</textarea>
            </div>
            <div class="editor-pane">
                <div class="editor-header">JS</div>
                <textarea id="js-code" spellcheck="false">console.log('Playground loaded');</textarea>
            </div>
        </div>
        <div class="preview">
            <iframe id="result-frame"></iframe>
        </div>
    </div>
    <script>
        const htmlCode = document.getElementById('html-code');
        const cssCode = document.getElementById('css-code');
        const jsCode = document.getElementById('js-code');
        const resultFrame = document.getElementById('result-frame');
        const examples = document.getElementById('examples');

        function runCode() {
            const frameDoc = resultFrame.contentDocument || resultFrame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(`
                <!DOCTYPE html>
                <html>
                <head>
    <link rel="canonical" href="https://sanskarin.github.io/Web-Development-Mastery/playground.html">
                    <style>${cssCode.value}</style>
                </head>
                <body>
                    ${htmlCode.value}
                    <script>${jsCode.value}<\/script>
                </body>
                </html>
            `);
            frameDoc.close();
        }

        function downloadCode() {
            const content = `<!DOCTYPE html>\n<html>\n<head>
    <link rel="canonical" href="https://sanskarin.github.io/Web-Development-Mastery/playground.html">\n<style>\n${cssCode.value}\n</style>\n</head>\n<body>\n${htmlCode.value}\n<script>\n${jsCode.value}\n<\/script>\n</body>\n</html>`;
            const blob = new Blob([content], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'playground-export.html';
            a.click();
        }

        const presets = {
            empty: { html: '', css: '', js: '' },
            flexbox: { html: '<div class="container">\n  <div class="box">1</div>\n  <div class="box">2</div>\n  <div class="box">3</div>\n</div>', css: '.container {\n  display: flex;\n  gap: 10px;\n  padding: 20px;\n  background: #eee;\n}\n.box {\n  background: #6c63ff;\n  color: white;\n  padding: 20px;\n  border-radius: 8px;\n}', js: '' },
            button: { html: '<button class="btn">Click Me</button>', css: '.btn {\n  padding: 10px 20px;\n  background: #3ecfcf;\n  border: none;\n  border-radius: 5px;\n  cursor: pointer;\n  transition: transform 0.2s;\n}\n.btn:hover {\n  transform: scale(1.1);\n}', js: 'document.querySelector(".btn").addEventListener("click", () => alert("Clicked!"));' }
        };

        examples.addEventListener('change', (e) => {
            const val = e.target.value;
            htmlCode.value = presets[val].html;
            cssCode.value = presets[val].css;
            jsCode.value = presets[val].js;
            runCode();
        });

        [htmlCode, cssCode, jsCode].forEach(el => el.addEventListener('keyup', () => {
            // Optional: Live preview on type (debounced)
        }));
        
        runCode();
    </script>
</body>
</html>
